<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF8F4" />
    <!-- Critical self-hosted fonts: body text (Jost) + hero script (Allura).
        crossorigin is required for font preloads even same-origin. -->
    <link rel="preload" href="/fonts/jost-var-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/allura-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The JSON-LD (LocalBusiness, WebSite, FAQPage) is injected here at
         prerender time; values come exclusively from src/seo.ts. -->
    <!--app-head-->
    <!-- The __SEO_*__ placeholders are replaced in dev by the Vite plugin
         "seo-tokens-dev" (home meta from src/seo.ts) and at build time by
         scripts/prerender.mjs per route. Do not hardcode meta values! -->
    <title>__SEO_TITLE__</title>
    <meta name="description" content="__SEO_DESCRIPTION__" />
    <link rel="canonical" href="__SEO_CANONICAL__" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zum Wohl Mobil" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:title" content="__SEO_TITLE__" />
    <meta property="og:description" content="__SEO_DESCRIPTION__" />
    <meta property="og:url" content="__SEO_CANONICAL__" />
    <meta property="og:image" content="__SEO_OG_IMAGE__" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__SEO_TITLE__" />
    <meta name="twitter:description" content="__SEO_DESCRIPTION__" />
    <meta name="twitter:image" content="__SEO_OG_IMAGE__" />
  </head>
  <body>
    <!-- Prerendered HTML lands between these comments / inside the root
         div; the client hydrates it (hydrateRoot in main.tsx). -->
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
