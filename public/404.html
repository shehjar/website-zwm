<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Seite nicht gefunden – Zum Wohl Mobil</title>
    <link rel="icon" type="image/svg+xml" href="/Logo.svg" />
    <style>
      /* Standalone page (Netlify serves it for any missing path) — brand
         colors from src/index.css, system font stack to stay dependency-free. */
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf8f4;
        color: #5f7363;
        font-family: 'Jost', ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      main { max-width: 32rem; }
      img { height: 96px; width: auto; margin-bottom: 2rem; }
      h1 { font-size: 2rem; font-weight: 500; margin: 0 0 0.75rem; }
      p { font-size: 1.05rem; line-height: 1.6; margin: 0 0 2rem; }
      a.button {
        display: inline-block;
        background: #5f7363;
        color: #fff;
        text-decoration: none;
        padding: 0.8rem 2rem;
        border-radius: 999px;
        font-weight: 500;
      }
      a.button:hover { background: #4c5d50; }
    </style>
  </head>
  <body>
    <main>
      <img src="/Logo.svg" alt="Zum Wohl Mobil" />
      <h1>Diese Seite gibt es nicht</h1>
      <p>
        Vielleicht hat sich der Link verändert oder die Seite wurde entfernt.
        Kein Grund zum Anstoßen – auf der Startseite findest du alles Wichtige.
      </p>
      <a class="button" href="/">Zur Startseite</a>
    </main>
  </body>
</html>
